<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MOMZ'Z AUTO GARAGE - Vehicle & Task Management System</title>
    
    <!-- Early PWA Prompt Capture -->
    <script>
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        console.log('[PWA] Global beforeinstallprompt captured!');
      });
    </script>

    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOMZ'Z GARAGE" />
    
    <!-- Early Theme Loader (Zero Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('garagehub_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-100 dark:bg-[#080810] text-zinc-900 dark:text-zinc-100 font-sans antialiased min-h-screen selection:bg-yellow-400 selection:text-zinc-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
